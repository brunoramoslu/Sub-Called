# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest', 'windows-latest']
        perl: [ '5.10', '5.20', '5.24', 'latest' ]
        threaded: [true, false]
    name: Perl ${{ matrix.perl }} on ${{ matrix.os }} (threaded ${{ matrix.threaded }} )
    steps:
      - uses: actions/checkout@v4
      - name: Set up perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}
          multi-thread: ${{ matrix.threaded }}
      - name: Install build tools 
        run: cpanm -v ExtUtils::MakeMaker Module::Build Dist::Zilla@5.048
      - name: Perl version
        run: perl -V
      - name: Install build dependencies 
        run: |
          dzil authordeps --missing | cpanm -v --notest
          dzil listdeps --author --missing | cpanm -v --notest
          dzil test --author --release --test-verbose
      - name: Run tests
        run: prove -lv t
